name: Deploy Stoxs8

on:
  push:
    branches: [main]

concurrency:
  group: stoxs8-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Test the API
        working-directory: apps/api
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e ../..
          python -m pytest -q tests -p no:warnings

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Build the website
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: https://8-231-81-151.sslip.io
        run: |
          npm ci
          npm run build

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/203916050989/locations/global/workloadIdentityPools/github/providers/github
          service_account: stoxs8-deploy@stoxs8-mumbai.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Publish to the Mumbai server
        env:
          SSH_KEY: ${{ secrets.STOXS8_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/stoxs8
          chmod 600 ~/.ssh/stoxs8
          echo '[localhost]:2222 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHh53Y50YEt+P7SvoDBF0ztrz+T7GxBicQm6ufvyRx98' >> ~/.ssh/known_hosts
          gcloud compute start-iap-tunnel stoxs8 22 \
            --zone=asia-south1-a \
            --project=stoxs8-mumbai \
            --local-host-port=localhost:2222 \
            >"$RUNNER_TEMP/iap.log" 2>&1 &
          tunnel_pid=$!
          ready=0
          for _ in $(seq 1 40); do
            if (echo >/dev/tcp/127.0.0.1/2222) >/dev/null 2>&1; then
              ready=1
              break
            fi
            if ! kill -0 "$tunnel_pid" 2>/dev/null; then
              echo "IAP tunnel exited"
              cat "$RUNNER_TEMP/iap.log"
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "IAP tunnel did not open"
            cat "$RUNNER_TEMP/iap.log"
            exit 1
          fi
          ssh_cmd="ssh -p 2222 -i ~/.ssh/stoxs8 -o StrictHostKeyChecking=yes"
          rsync -az --delete \
            --exclude .git \
            --exclude .env \
            --exclude data \
            --exclude apps/api/.venv \
            --exclude apps/web/.next/cache \
            --exclude '**/__pycache__' \
            --exclude .pytest_cache \
            -e "$ssh_cmd" \
            ./ deploy@localhost:/opt/stoxs8-staging/
          $ssh_cmd deploy@localhost sudo /usr/local/bin/stoxs8-deploy
