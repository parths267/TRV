services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bazaar
      POSTGRES_PASSWORD: bazaar
      POSTGRES_DB: bazaar
    ports:
      - "5432:5432"
    volumes:
      - bazaar_pg:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    image: python:3.12-slim
    working_dir: /srv
    command: >
      bash -c "pip install -r apps/api/requirements.txt &&
      cd apps/api && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      PYTHONPATH: /srv/src
      APP_ENV: development
      SECRET_KEY: change-me-before-any-shared-deployment
      DATABASE_URL: postgresql+psycopg://bazaar:bazaar@postgres:5432/bazaar
      DATA_MODE: live
      SCHEDULER_ENABLED: "true"
      CORS_ORIGINS: http://localhost:3000
      LIVE_TRADING_ENABLED: "false"
    volumes:
      - .:/srv
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  web:
    image: node:22
    working_dir: /srv/apps/web
    command: bash -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
    volumes:
      - .:/srv
    ports:
      - "3000:3000"

volumes:
  bazaar_pg:
